name: Build, testes e publicação web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar GitHub Pages (se ainda não estiver)
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # O repositório guarda apenas lib/, test/ e pubspec.yaml.
      # Aqui geramos as pastas android/ e web/ e restauramos os nossos arquivos.
      - name: Gerar plataformas web e android
        run: |
          flutter create --platforms=web,android --project-name horas_de_estudo .
          git checkout -- lib test pubspec.yaml analysis_options.yaml

      - run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar plataformas web e android
        run: |
          flutter create --platforms=web,android --project-name horas_de_estudo .
          git checkout -- lib test pubspec.yaml analysis_options.yaml

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: horas-de-estudo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
